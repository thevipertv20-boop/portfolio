<section class="about-me" id="about">
    <div class="about-me-portrait">
        <img src="assets/profile/Sebastian-Mucha.png" [alt]="t().aboutMe.portraitAlt">
    </div>

    <div class="about-me-content">
        <span class="about-me-eyebrow">{{ t().aboutMe.eyebrow }}</span>

        <div class="about-me-box">
            <h2 class="about-me-title">{{ t().aboutMe.title }}</h2>

            <p class="about-me-text">{{ t().aboutMe.text }}</p>

            <ul class="about-me-highlights">
                @for (highlight of t().aboutMe.highlights; track $index) {
                    <li>
                        <img [src]="highlightIcons[$index]" alt="">
                        <span>{{ highlight }}</span>
                    </li>
                }
            </ul>
        </div>
    </div>
</section>
