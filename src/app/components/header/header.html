<header class="header">
    <nav class="navbar">
        <div class="nav-left" id="main-menu" [class.open]="menuOpen">

            <div class="language-switch">
                @for (lang of languages; track lang) {
                    <button class="language" [class.active]="language() === lang" (click)="setLanguage(lang)">
                        {{ lang }}
                    </button>
                }
            </div>
            <div class="nav-links" (click)="closeMenu()">
                <a routerLink="/" fragment="about">{{ t().header.aboutMe }}</a>
                <a routerLink="/" fragment="skills">{{ t().header.skills }}</a>
                <a routerLink="/" fragment="projects" class="active-link">
                    {{ t().header.projects }}
                    <span class="active-dot"></span>
                </a>
            </div>
        </div>

        <a routerLink="/" class="logo" (click)="closeMenu()">
            <img class="logo-normal" src="assets/icons/Sebastian Mucha Logo mit Monogramm.png" alt="Sebastian Mucha">
            <img class="logo-hover" src="assets/icons/Sebastian Mucha Logo mit Monogramm.png" alt="">
        </a>

        <button class="burger" type="button" [class.open]="menuOpen" [attr.aria-label]="t().header.menu"
            [attr.aria-expanded]="menuOpen" aria-controls="main-menu" (click)="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <svg class="logo-filter" aria-hidden="true">
            <filter id="logo-outline">
                <feMorphology in="SourceAlpha" operator="erode" radius="1" result="inside" />
                <feComposite in="SourceGraphic" in2="inside" operator="out" />
            </filter>
        </svg>

    </nav>
</header>
