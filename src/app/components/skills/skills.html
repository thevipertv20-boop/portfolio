<section class="skills" id="skills">
    <div class="skills-content">
        <span class="skills-eyebrow">{{ t().skills.eyebrow }}</span>

        <div class="skills-box">
            <h2 class="skills-box-title">{{ t().skills.title }}</h2>

            <p class="skills-box-text">{{ t().skills.text }}</p>

            <h3 class="skills-box-subtitle">
                {{ t().skills.subtitleStart }} <span>{{ t().skills.subtitleHighlight }}</span>
            </h3>

            <p class="skills-box-note">{{ t().skills.note }}</p>

            <a href="#contact" class="skills-box-button">
                <span class="skills-box-button-text">{{ t().skills.letsTalk }}</span>
            </a>
        </div>
    </div>

    <ul class="skill-grid">
        @for (skill of skills; track skill.name) {
            <li class="skill">
                <img [src]="skill.icon" alt="">
                <span>{{ skill.name }}</span>
                @if (skill.popup) {
                    <div class="skill-popup">
                        <img [src]="skill.popup" [alt]="t().skills.growthPopupAlt">
                    </div>
                }
            </li>
        }
    </ul>
</section>
